name: images

on:
  pull_request:
    paths:
      - "deploy/Dockerfile.*"
      - "src/**"
      - ".github/workflows/images.yml"
  push:
    branches: [dev, main]
    paths:
      - "deploy/Dockerfile.*"
      - "src/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
          - image: service
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: echo "${{ matrix.image }} ok"
