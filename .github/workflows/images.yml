name: images

on:
  pull_request:
    paths:
      - "deploy/Dockerfile.*"
      - "src/**"
      - ".github/workflows/images.yml"
  push:
    branches: [dev, main]
    paths:
      - "deploy/Dockerfile.*"
      - "src/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: worker
            dockerfile: deploy/Dockerfile.worker
          - image: service
            dockerfile: deploy/Dockerfile.service
          - image: control-plane
            dockerfile: deploy/Dockerfile.control-plane
          - image: llm-gateway
            dockerfile: deploy/Dockerfile.gateway
          - image: web
            dockerfile: deploy/Dockerfile.web
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push on dev/main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/loom-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=images-${{ matrix.image }}
          cache-to: type=gha,scope=images-${{ matrix.image }},mode=max
          provenance: false
